<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Starry Night | Living Canvas</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #06143c;
}

body {
    display: grid;
    place-items: center;
}

.canvas {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #09245f;
}

svg {
    width: 100%;
    height: 100%;
    display: block;
}

.sky {
    fill: url(#skyGradient);
}

.brush {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    animation: drift 18s ease-in-out infinite alternate;
}

.blue {
    stroke: #1553a6;
    stroke-width: 12;
}

.cyan {
    stroke: #44b9ed;
    stroke-width: 8;
}

.pale {
    stroke: #a1e6f5;
    stroke-width: 5;
}

.deep {
    stroke: #071b58;
    stroke-width: 9;
}

.green {
    stroke: #87c96b;
    stroke-width: 4;
}

.star-glow {
    fill: #ffe94d;
    opacity: .22;
    filter: url(#glow);
}

.star-ring {
    fill: none;
    stroke-linecap: round;
    stroke-width: 5;
    animation: breathe 4s ease-in-out infinite alternate;
}

.star-ring:nth-child(even) {
    animation-delay: -2s;
}

.star-core {
    fill: #ffda39;
    filter: url(#glow);
}

.moon {
    fill: url(#moonGradient);
    filter: url(#glow);
}

.cypress {
    fill: url(#treeGradient);
    stroke: #101d17;
    stroke-width: 3;
    stroke-linejoin: round;
}

.tree-stroke {
    fill: none;
    stroke: #253c2c;
    stroke-width: 5;
    stroke-linecap: round;
}

.village {
    fill: #101c35;
    stroke: #17294a;
    stroke-width: 2;
}

@keyframes drift {
    from { transform: translateX(-2px) translateY(0); }
    to   { transform: translateX(3px) translateY(-2px); }
}

@keyframes breathe {
    from { opacity: .65; }
    to   { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
    }
}
</style>
</head>

<defs>

        <stop offset="0%" stop-color="#07184e"/>
        <stop offset="45%" stop-color="#103d91"/>
        <stop offset="100%" stop-color="#1265ad"/>
    </linearGradient>

    <radialGradient id="moonGradient">
        <stop offset="0%" stop-color="#fffba0"/>
        <stop offset="45%" stop-color="#ffe64d"/>
        <stop offset="75%" stop-color="#ffb51e"/>
        <stop offset="100%" stop-color="#ffcf39"/>
    </radialGradient>

    <linearGradient id="treeGradient" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#07170f"/>
        <stop offset="55%" stop-color="#172b20"/>
        <stop offset="100%" stop-color="#101d19"/>
    </linearGradient>

    <filter id="glow" x="-100%" y="-100%"
            width="300%" height="300%">
        <feGaussianBlur stdDeviation="9" result="blur"/>
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

    <filter id="paintTexture" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise"
            baseFrequency=".035"
            numOctaves="2" seed="8" result="noise"/>
        <feDisplacementMap in="SourceGraphic"
            in2="noise" scale="5"/>
    </filter>

    <g id="star">

        <circle class="star-ring" r="35"

                 Q26,-23 32,-2 Q17,20 -4,29

    </g>
</defs>
